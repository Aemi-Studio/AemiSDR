name: AemiSDRDemo
options:
  bundleIdPrefix: studio.aemi
  deploymentTarget:
    iOS: "18.0"

packages:
  AemiSDR:
    path: ../..

targets:
  AemiSDRDemo:
    type: application
    platform: iOS
    sources:
      - Sources/AemiSDRDemo
    dependencies:
      - package: AemiSDR
    settings:
      base:
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: NP94WB3P75
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
