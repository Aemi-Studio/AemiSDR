summary: >
  AemiSDR's core effects (LiquidLens Metal pipeline, VisualEffect, AlphaMask, VariableBlur)
  are well-architected with excellent physics-based shader code, correct Metal/Swift struct
  alignment, and clean public APIs. The main debt is in three areas: (1) Infrastructure DRY —
  13 identical kernel-loading blocks, duplicated mask generation switches, 4 pairs of
  near-identical CIKernel functions, and repeated modifier parameter lists; (2) Demo bloat —
  6 unreachable top-level demo views (~3,400 lines), 7 dead sub-views (~694 lines), and
  duplicate slider helpers; (3) Test coverage — only 24 tests in 1 file covering SDF math,
  with zero coverage of the entire rendering pipeline, configuration, view modifiers, and
  build tools. Phase 1 (dead code removal) and Phase 2 (DRY consolidation) would eliminate
  the most impactful issues. The codebase has no security concerns, no retain cycle risks,
  the Metal pipeline is well-managed, and the zero-copy texture bridge is correctly implemented.
